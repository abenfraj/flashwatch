name: Release

# A push to main that touches the application produces a new version: tests run,
# the version is bumped, the .exe is built on a Windows runner, and a GitHub
# release is published with the notes and the binary attached.
#
# The download page reads the releases through the GitHub API at load time, so
# there is nothing to redeploy afterwards -- publishing here *is* publishing on
# the site, including for every older version.

on:
  push:
    branches: [main]
    # Documentation and the website are not the application. Changing them must
    # not mint a version whose binary is identical to the previous one.
    paths-ignore:
      - 'site/**'
      - '**/*.md'
      - '.gitignore'
      - '.github/**'
      # The art-direction kit, including the reference images dropped into
      # design/reference/. Those are not .md, so without this line adding a
      # mockup would mint a version whose binary is byte-identical.
      - 'design/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Taille de l''incrément'
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write        # to create the tag and the release

# One release at a time: two runs racing would fight over the next tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A Windows binary needs a Windows runner. This is also the only place the
    # build is reproduced from a clean checkout, which is what catches a missing
    # dependency long before a user does.
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"

    env:
      # Code signing is opt-in and inert until a certificate exists. Both
      # secrets unset -- which is the state today, and the state in any fork --
      # means the signing step below skips itself and the build is byte for byte
      # what it was before. Nothing here has to be undone to build unsigned.
      SIGN_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
      SIGN_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      # The other route, and the one that costs nothing: SignPath's foundation
      # signs open-source projects for free. Unset here too, and equally inert
      # until it is not -- see the step near the end of this job.
      SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags and history: the version and the notes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Tests
        env:
          # No desktop session on a runner; every suite was verified to pass with
          # Qt's offscreen platform.
          QT_QPA_PLATFORM: offscreen
        run: |
          $failed = @()
          foreach ($test in Get-ChildItem tests/test_*.py | Sort-Object Name) {
            # The performance suite asserts millisecond budgets measured on a
            # developer machine; a shared runner cannot honour them and a slow
            # runner must not block a release.
            if ($test.Name -eq 'test_ocr_performance.py') {
              Write-Host "SKIP $($test.Name) (timing assertions)"
              continue
            }
            Write-Host "==== $($test.Name)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $test.Name }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::failing suites: $($failed -join ', ')"
            exit 1
          }

      - name: Work out the version and the notes
        id: meta
        run: python tools/release_meta.py --write --bump ${{ inputs.bump || 'patch' }}

      - name: Build the executable
        run: python build.py

      # ── Authenticode signature ─────────────────────────────────────────
      # This is the only thing that removes "Windows protected your PC". The
      # warning is not about what the program does; it is about the executable
      # carrying no verified publisher, and nothing in the build can substitute
      # for one.
      #
      # Two routes, depending on the certificate:
      #
      #   * a .pfx file, which is what this step expects -- base64 it into
      #     WINDOWS_CERT_BASE64 and put its password in WINDOWS_CERT_PASSWORD.
      #     Only possible for certificate types whose private key may leave a
      #     token, which since the 2023 storage rules is a shrinking set;
      #   * a cloud signing service (Azure Trusted Signing and similar), where
      #     the key never exists as a file and signing is an action rather than
      #     a signtool invocation. That replaces this step rather than
      #     configuring it.
      #
      # Timestamped deliberately: without /tr the signature dies with the
      # certificate, and every already-downloaded copy starts warning again on
      # the day it expires.
      - name: Sign the executable
        if: env.SIGN_CERT != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT))
          $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' `
                    -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'x64' } |
                  Select-Object -First 1 -ExpandProperty FullName
          if (-not $tool) { throw 'signtool.exe not found on the runner' }
          & $tool sign /f $pfx /p $env:SIGN_PASS /fd SHA256 `
                  /tr http://timestamp.digicert.com /td SHA256 `
                  /d 'Flashwatch' dist/Flashwatch.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed ($LASTEXITCODE)" }
          # Removed rather than left for the job to clean up: the runner is
          # disposable, but the file is a private key and the log is public.
          Remove-Item $pfx -Force
          & $tool verify /pa /v dist/Flashwatch.exe
          if ($LASTEXITCODE -ne 0) { throw 'the signature did not verify' }

      # ── SignPath, for open source ──────────────────────────────────────
      # Free for projects with a public repository and a recognised licence,
      # which this one now has. The certificate belongs to the foundation and
      # its private key never leaves their HSM: what is verified is not an
      # identity but the *origin* of the binary, which is why the artifact has
      # to be uploaded first and handed over by id. A build made anywhere else
      # cannot be signed with it, which is the point.
      #
      # Four values turn this on, and nothing has to be undone to leave it off:
      #   secrets.SIGNPATH_API_TOKEN, vars.SIGNPATH_ORGANIZATION_ID,
      #   vars.SIGNPATH_PROJECT_SLUG, vars.SIGNPATH_POLICY_SLUG
      - name: Upload the unsigned build for SignPath
        if: env.SIGNPATH_TOKEN != ''
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: flashwatch-unsigned
          path: dist/Flashwatch.exe

      - name: Sign it
        if: env.SIGNPATH_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Straight back over the unsigned one, so every step after this --
          # the size check, the release upload -- sees the signed executable
          # without knowing anything happened.
          output-artifact-directory: dist

      - name: Check what came out
        run: |
          $exe = 'dist/Flashwatch.exe'
          if (-not (Test-Path $exe)) { throw 'no executable was produced' }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "built $exe  ($mb MB)"
          # A bundle missing the OCR models or Qt would come out far too small,
          # and would fail only once a user ran it.
          if ($mb -lt 60) { throw "suspiciously small: $mb MB" }
          "size=$mb MB" >> $env:GITHUB_OUTPUT
        id: artifact

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/Flashwatch.exe
          fail_on_unmatched_files: true
          make_latest: true
